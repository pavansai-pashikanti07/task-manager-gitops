apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-manager-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pavansai-pashikanti07/task-manager-gitops.git
    targetRevision: HEAD
    path: base
  destination:
    server: https://kubernetes.default.svc
    namespace: task-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
